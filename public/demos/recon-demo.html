<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recon Console Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #131219;
        --panel: #1a1922;
        --panel-2: #201f2a;
        --line: #2c2a38;
        --line-soft: #232130;
        --fg: #e7e4f1;
        --fg-dim: #9a96b0;
        --fg-faint: #6b6782;
        --accent: #8b7bf7;
        --accent-soft: rgba(139, 123, 247, 0.16);
        --new: #f5c542;
        --new-soft: rgba(245, 197, 66, 0.12);
        --s2: #55c99a;
        --s3: #6ba8e8;
        --s4: #e8905a;
        --s5: #e05c6e;
        --s0: #6b6782;
        --sans:
          "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, Segoe UI,
          Roboto, sans-serif;
        --mono:
          "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: radial-gradient(
          1200px 600px at 70% -10%,
          #1d1b2a 0%,
          var(--ink) 60%
        );
        color: var(--fg);
        font-family: var(--sans);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        width: 100%;
        max-width: 940px;
      }

      /* window frame */
      .win {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: var(--panel);
        box-shadow:
          0 40px 100px -20px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(139, 123, 247, 0.06);
      }
      .chrome {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 14px;
        background: #15141c;
        border-bottom: 1px solid var(--line);
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .dot.r {
        background: #e05c6e;
      }
      .dot.y {
        background: #e8b54a;
      }
      .dot.g {
        background: #55c99a;
      }
      .addr {
        flex: 1;
        margin-left: 8px;
        background: var(--ink);
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        padding: 5px 11px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg-faint);
        text-align: center;
      }
      .addr b {
        color: var(--fg-dim);
        font-weight: 500;
      }
      .livedot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--s2);
        box-shadow: 0 0 0 0 rgba(85, 201, 154, 0.5);
        animation: live 2s infinite;
      }
      @keyframes live {
        0% {
          box-shadow: 0 0 0 0 rgba(85, 201, 154, 0.5);
        }
        70% {
          box-shadow: 0 0 0 6px rgba(85, 201, 154, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(85, 201, 154, 0);
        }
      }

      /* toolbar */
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .brand b {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .brand span {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--fg-faint);
      }
      .scope {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg-dim);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 10px;
        background: var(--ink);
      }
      .search {
        flex: 1;
        max-width: 420px;
        position: relative;
        background: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 10px 5px 26px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg);
        min-height: 29px;
      }
      .search.hot {
        border-color: var(--accent);
      }
      .search::before {
        content: "/";
        position: absolute;
        left: 9px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--fg-faint);
      }
      .search .cur {
        display: inline-block;
        width: 7px;
        height: 14px;
        background: var(--accent);
        vertical-align: -2px;
        margin-left: 1px;
        opacity: 0;
      }
      .search.typing .cur {
        animation: blink 0.8s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 1;
        }
      }
      .runbtn {
        background: var(--accent);
        color: #12101f;
        font-weight: 600;
        font-size: 12px;
        border-radius: 6px;
        padding: 6px 13px;
        font-family: var(--sans);
      }

      /* stats */
      .stats {
        display: flex;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .stat {
        padding: 10px 20px;
        border-right: 1px solid var(--line-soft);
        min-width: 96px;
      }
      .stat .n {
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .stat .l {
        font-size: 10.5px;
        color: var(--fg-faint);
        margin-top: 1px;
      }
      .stat.k-new .n {
        color: var(--new);
      }
      .stat.k-new {
        position: relative;
      }
      .stat.k-new.flash {
        background: var(--new-soft);
        box-shadow: inset 0 -2px 0 var(--new);
      }
      .stat.k-live .n {
        color: var(--s2);
      }

      /* table */
      .thead {
        display: grid;
        grid-template-columns: 26px 1.9fr 0.7fr 0.8fr 1fr 1.4fr;
        gap: 0;
        padding: 8px 16px;
        font-size: 10.5px;
        color: var(--fg-dim);
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .tbody {
        height: 296px;
        overflow: hidden;
        position: relative;
      }
      .row {
        display: grid;
        grid-template-columns: 26px 1.9fr 0.7fr 0.8fr 1fr 1.4fr;
        gap: 0;
        align-items: center;
        padding: 9px 16px;
        border-bottom: 1px solid var(--line-soft);
        font-size: 12px;
        opacity: 0;
        transform: translateY(6px);
      }
      .row.show {
        opacity: 1;
        transform: none;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      .row.dim-out {
        opacity: 0.12;
        transition: opacity 0.4s ease;
      }
      .row.new {
        background: var(--new-soft);
      }
      .row .gut {
        display: block;
        width: 4px;
        height: 18px;
        border-radius: 2px;
      }
      .row .host {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row .host .ip {
        display: block;
        font-size: 10px;
        color: var(--fg-faint);
        margin-top: 2px;
      }
      .st {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 12px;
      }
      .st.c2 {
        color: var(--s2);
      }
      .st.c3 {
        color: var(--s3);
      }
      .st.c4 {
        color: var(--s4);
      }
      .st.c5 {
        color: var(--s5);
      }
      .st.c0 {
        color: var(--s0);
      }
      .cell.mono {
        font-family: var(--mono);
        color: var(--fg-dim);
        font-size: 11px;
      }
      .tag {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 3px;
        font-family: var(--mono);
        font-size: 10px;
        border: 1px solid var(--line);
        color: var(--fg-dim);
        margin-right: 3px;
      }
      .tag.tech {
        white-space: nowrap;
      }
      .badge-new {
        background: var(--new);
        color: #241d06;
        font-weight: 700;
        font-size: 9.5px;
        font-family: var(--mono);
        padding: 1px 6px;
        border-radius: 3px;
        letter-spacing: 0.02em;
      }
      .row.new .gut {
        animation: pulseg 1.4s ease 2;
      }
      @keyframes pulseg {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(245, 197, 66, 0);
        }
        50% {
          box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.35);
        }
      }

      .scanline {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        opacity: 0;
      }
      .scanline.on {
        animation: scan 1.1s ease-in-out;
      }
      @keyframes scan {
        0% {
          opacity: 0;
          top: 0;
        }
        15% {
          opacity: 1;
        }
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          top: 296px;
        }
      }

      .caption {
        text-align: center;
        margin-top: 16px;
        font-size: 12.5px;
        color: var(--fg-faint);
        font-family: var(--mono);
        min-height: 16px;
      }
      .caption b {
        color: var(--accent);
        font-weight: 500;
      }

      @media (max-width: 620px) {
        .thead,
        .row {
          grid-template-columns: 20px 1.6fr 0.6fr 1fr;
        }
        .col-len,
        .col-cdn,
        .thead .h-len,
        .thead .h-cdn {
          display: none;
        }
        .stat {
          padding: 9px 13px;
          min-width: 74px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .row {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="win">
        <div class="chrome">
          <span class="dot r"></span><span class="dot y"></span
          ><span class="dot g"></span>
          <div class="addr">
            <b>recon</b> console · demo<span
              class="livedot"
              style="
                display: inline-block;
                margin-left: 8px;
                vertical-align: middle;
              "
            ></span>
          </div>
        </div>

        <div class="bar">
          <div class="brand"><b>Recon Console</b><span>synced</span></div>
          <div class="scope">example.com ▾</div>
          <div class="search" id="search">
            <span id="searchTxt"></span><span class="cur"></span>
          </div>
          <div class="runbtn">Build scan</div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="n" id="stAssets">0</div>
            <div class="l">assets</div>
          </div>
          <div class="stat k-new" id="stNewBox">
            <div class="n" id="stNew">0</div>
            <div class="l">new</div>
          </div>
          <div class="stat k-live">
            <div class="n" id="stLive">0</div>
            <div class="l">responding</div>
          </div>
          <div class="stat">
            <div class="n" id="stIp">0</div>
            <div class="l">unique ips</div>
          </div>
        </div>

        <div class="thead">
          <div></div>
          <div>subdomain</div>
          <div class="h-len col-len">status</div>
          <div>port</div>
          <div class="h-cdn col-cdn">cdn</div>
          <div>technologies</div>
        </div>
        <div class="tbody" id="tbody">
          <div class="scanline" id="scanline"></div>
        </div>
      </div>
      <div class="caption" id="caption"></div>
    </div>

    <script>
      "use strict";
      const $ = (s) => document.querySelector(s);
      const DATA = [
        {
          h: "shop.example.com",
          ip: "143.166.83.38",
          s: 200,
          port: "443",
          cdn: "akamai",
          tech: ["Akamai", "React"],
        },
        {
          h: "support.example.com",
          ip: "143.166.147.12",
          s: 200,
          port: "443",
          cdn: "akamai",
          tech: ["nginx", "jQuery"],
        },
        {
          h: "api.analytics.example.com",
          ip: "52.249.34.177",
          s: 401,
          port: "443",
          cdn: "azure",
          tech: ["ASP.NET"],
        },
        {
          h: "vpn-eu.example.com",
          ip: "143.166.11.24",
          s: 403,
          port: "443",
          cdn: "",
          tech: ["F5 BIG-IP"],
        },
        {
          h: "jenkins-stg.example.com",
          ip: "10.14.22.9",
          s: 200,
          port: "8080",
          cdn: "",
          tech: ["Jenkins", "Java"],
        },
        {
          h: "cdn-assets.example.com",
          ip: "23.55.161.9",
          s: 200,
          port: "443",
          cdn: "cloudflare",
          tech: ["Cloudflare"],
        },
        {
          h: "legacy-mail.example.com",
          ip: "143.166.90.7",
          s: 500,
          port: "443",
          cdn: "",
          tech: ["IIS/7.5"],
        },
      ];
      const NEWHOST = {
        h: "grafana-dev.example.com",
        ip: "10.14.30.44",
        s: 302,
        port: "3000",
        cdn: "",
        tech: ["Grafana"],
        isNew: true,
      };

      const cls = (s) => "c" + String(s)[0];
      const gut = (s) =>
        ({ 2: "var(--s2)", 3: "var(--s3)", 4: "var(--s4)", 5: "var(--s5)" })[
          String(s)[0]
        ] || "var(--s0)";

      function rowHTML(r) {
        const badge = r.isNew ? '<span class="badge-new">NEW</span>' : "";
        const tech = r.tech
          .map((t) => `<span class="tag tech">${t}</span>`)
          .join("");
        return `<div class="row${r.isNew ? " new" : ""}" data-s="${String(r.s)[0]}">
    <div><span class="gut" style="background:${gut(r.s)}"></span></div>
    <div class="host">${r.h}${badge}<span class="ip">${r.ip}</span></div>
    <div class="cell col-len"><span class="st ${cls(r.s)}">${r.s}</span></div>
    <div class="cell mono">${r.port}</div>
    <div class="cell col-cdn">${r.cdn ? `<span class="tag">${r.cdn}</span>` : '<span class="cell mono">—</span>'}</div>
    <div class="cell">${tech}</div>
  </div>`;
      }

      const tbody = $("#tbody"),
        caption = $("#caption");
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      function countUp(el, to, ms) {
        const from = +el.textContent || 0,
          t0 = performance.now();
        return new Promise((res) => {
          (function step(t) {
            const p = Math.min(1, (t - t0) / ms),
              v = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
            el.textContent = v;
            p < 1 ? requestAnimationFrame(step) : res();
          })(t0);
        });
      }
      async function typeInto(txt) {
        const el = $("#searchTxt"),
          box = $("#search");
        box.classList.add("hot", "typing");
        el.textContent = "";
        for (const c of txt) {
          el.textContent += c;
          await sleep(75);
        }
      }

      function reset() {
        tbody.querySelectorAll(".row").forEach((r) => r.remove());
        $("#searchTxt").textContent = "";
        $("#search").classList.remove("hot", "typing");
        ["stAssets", "stNew", "stLive", "stIp"].forEach(
          (id) => ($("#" + id).textContent = "0"),
        );
        $("#stNewBox").classList.remove("flash");
      }

      async function play() {
        reset();
        caption.innerHTML =
          "Simulated data · enumeration across <b>subfinder · amass · httpx</b>";
        $("#scanline").classList.remove("on");
        void $("#scanline").offsetWidth;
        $("#scanline").classList.add("on");
        await sleep(500);

        // stream first pass
        let ipset = new Set(),
          live = 0;
        for (let i = 0; i < DATA.length; i++) {
          const r = DATA[i];
          tbody.insertAdjacentHTML("beforeend", rowHTML(r));
          const el = tbody.lastElementChild;
          requestAnimationFrame(() => el.classList.add("show"));
          ipset.add(r.ip);
          if (r.s < 400) live++;
          countUp($("#stAssets"), i + 1, 220);
          $("#stLive").textContent = live;
          $("#stIp").textContent = ipset.size;
          await sleep(360);
        }
        caption.innerHTML =
          "<b>7 assets</b> mapped · results stored to this scope";
        await sleep(1700);

        // second scan → new host appears
        caption.innerHTML = "Re-scan &mdash; diffing against stored assets…";
        $("#scanline").classList.remove("on");
        void $("#scanline").offsetWidth;
        $("#scanline").classList.add("on");
        await sleep(950);

        tbody.insertAdjacentHTML("afterbegin", rowHTML(NEWHOST));
        // keep scanline first child visually fine; move new row after scanline
        const scan = $("#scanline");
        tbody.insertBefore(scan, tbody.firstChild);
        const nr = tbody.querySelector(".row.new");
        requestAnimationFrame(() => nr.classList.add("show"));
        $("#stNewBox").classList.add("flash");
        countUp($("#stAssets"), 8, 300);
        await countUp($("#stNew"), 1, 400);
        caption.innerHTML =
          "<b>grafana-dev.example.com</b> &mdash; new since last scan, flagged automatically";
        await sleep(2100);

        // filter to new
        await typeInto("is:new");
        tbody
          .querySelectorAll(".row:not(.new)")
          .forEach((r) => r.classList.add("dim-out"));
        caption.innerHTML =
          "Filter <b>is:new</b> &mdash; isolate what changed, export to your next tool";
        await sleep(2600);

        // fade out for loop
        tbody
          .querySelectorAll(".row")
          .forEach((r) => r.classList.add("dim-out"));
        await sleep(700);
      }

      async function loop() {
        while (true) {
          await play();
          await sleep(600);
        }
      }
      if (window.matchMedia("(prefers-reduced-motion:reduce)").matches) {
        // static frame for reduced motion
        [NEWHOST, ...DATA].forEach((r) =>
          tbody.insertAdjacentHTML("beforeend", rowHTML(r)),
        );
        tbody.querySelectorAll(".row").forEach((r) => r.classList.add("show"));
        $("#stAssets").textContent = 8;
        $("#stNew").textContent = 1;
        $("#stLive").textContent = 5;
        $("#stIp").textContent = 8;
        $("#stNewBox").classList.add("flash");
        caption.innerHTML =
          "New subdomains flagged automatically on every re-scan";
      } else {
        loop();
      }
    </script>
  </body>
</html>
